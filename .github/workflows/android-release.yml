name: Android Release Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: fanyi_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          cache: true

      - name: Create validation log directory
        run: mkdir -p ../artifacts

      - name: Install dependencies
        run: flutter pub get

      - name: Static analyze
        run: flutter analyze 2>&1 | tee ../artifacts/flutter-analyze.log

      - name: Unit tests
        run: flutter test 2>&1 | tee ../artifacts/flutter-test.log

      - name: Build APK
        run: flutter build apk --release 2>&1 | tee ../artifacts/flutter-build-apk.log

      - name: Build AAB
        run: flutter build appbundle --release 2>&1 | tee ../artifacts/flutter-build-aab.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: fanyi_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: fanyi_app/build/app/outputs/bundle/release/app-release.aab

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-validation-logs
          path: artifacts
          if-no-files-found: warn
