name: Android Release Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - codex/mobile-fanyi-fix

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fanyi_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Bootstrap platform files
        run: flutter create --org com.fanyitong --project-name fanyi_tong --platforms=android .

      - name: Install dependencies
        run: flutter pub get

      - name: Static analyze
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: fanyi_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: fanyi_app/build/app/outputs/bundle/release/app-release.aab

