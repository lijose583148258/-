name: Android Firebase Test Lab OEM Devices

on:
  workflow_dispatch:
    inputs:
      firebase_project:
        description: Firebase / Google Cloud project ID with Test Lab enabled
        required: true
        type: string
      device_filters:
        description: Comma-separated physical device filters
        required: true
        default: xiaomi,oppo,oneplus,realme,honor,huawei
        type: string
      results_bucket:
        description: Optional Firebase Test Lab results bucket
        required: false
        type: string

jobs:
  firebase-test-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          cache: true

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Run Flutter smoke test on Firebase Test Lab OEM devices
        shell: pwsh
        run: >
          ./scripts/run-firebase-test-lab.ps1
          -FirebaseProject '${{ inputs.firebase_project }}'
          -DeviceFilters '${{ inputs.device_filters }}'
          -ResultsBucket '${{ inputs.results_bucket }}'

      - name: Upload Firebase Test Lab request
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-test-lab-request
          path: artifacts/firebase-test-lab
          if-no-files-found: warn
