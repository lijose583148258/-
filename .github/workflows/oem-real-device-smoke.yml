name: OEM Real Device Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "fanyi_app/**"
      - ".github/workflows/oem-real-device-smoke.yml"
      - ".github/scripts/run_browserstack_oem.sh"

permissions:
  contents: read

concurrency:
  group: oem-real-device-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browserstack-oem:
    name: Xiaomi and OPlus real-device gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ secrets.BROWSERSTACK_USERNAME != '' && secrets.BROWSERSTACK_ACCESS_KEY != '' }}
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      DEVICE_FAMILIES: xiaomi,oneplus,oppo,realme,honor
      MIN_ANDROID_MAJOR: "10"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          cache: true

      - name: Install dependencies
        working-directory: fanyi_app
        run: flutter pub get

      - name: Build debug app APK
        working-directory: fanyi_app
        run: flutter build apk --debug --no-pub

      - name: Build instrumentation test APK
        working-directory: fanyi_app/android
        run: ./gradlew app:assembleDebugAndroidTest --no-daemon --stacktrace

      - name: Run OEM real-device acceptance
        env:
          BUILD_TAG: ${{ github.sha }}
        run: bash .github/scripts/run_browserstack_oem.sh

      - name: Upload OEM result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browserstack-oem-result
          path: browserstack-oem-result.json
          if-no-files-found: warn

  credentials-required:
    name: OEM cloud credentials configured
    runs-on: ubuntu-latest
    if: ${{ secrets.BROWSERSTACK_USERNAME == '' || secrets.BROWSERSTACK_ACCESS_KEY == '' }}
    steps:
      - name: Block release without real-device credentials
        run: |
          echo "BROWSERSTACK_USERNAME and BROWSERSTACK_ACCESS_KEY are required."
          echo "This check intentionally fails because AOSP emulators do not replace OEM real-device validation."
          exit 1
