name: fanyi_tong
description: 翻译通 - 中越翻译与学习 App，支持本地词典、在线兜底、语音输入和系统语音朗读。
version: 1.0.2+3
publish_to: none

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── 本地数据库 ─────────────────────────────────────
  # sqflite: Android 原生 SQLite，不依赖 Google Play 服务
  sqflite:
    path: third_party/sqflite
  path_provider:
    path: third_party/path_provider
  path: ^1.9.0             # 路径拼接工具

  # ── Google ML Kit 翻译（境外/有 Google Play 服务时自动启用）──
  # 有可用 ML Kit 运行环境且模型下载完成时，使用设备端翻译。
  # 不可用、初始化失败或超时时，自动降级到在线翻译或本地词典。
  google_mlkit_translation:
    path: third_party/google_mlkit_translation

  # ── 网络（在线翻译兜底）──────────────────────────────
  # http: 纯 Dart HTTP，不依赖平台插件
  http: ^1.6.0

  # ── 语音功能（调用手机系统引擎）──────────────────────
  # 具体语言能力取决于设备安装的语音识别和 TTS 引擎。
  flutter_tts:
    path: third_party/flutter_tts
  speech_to_text:
    path: third_party/speech_to_text

  # ── 权限管理 ──────────────────────────────────────
  # 运行时申请麦克风权限，兼容 Android 6.0+
  permission_handler:
    path: third_party/permission_handler

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    # 本地词典随 APK 打包，无需联网即可查询已收录条目
    - assets/dictionary.db
